services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jwars
      POSTGRES_USER: jwars
      POSTGRES_PASSWORD: jwars
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jwars-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwars -d jwars"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  jwars-postgres:
